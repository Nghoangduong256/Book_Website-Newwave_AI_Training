<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đọc sách | My Library</title>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="./index.html" class="brand">
          <span class="brand__icon" aria-hidden="true">▣</span>
          <span class="brand__name">My Library</span>
        </a>

        <nav class="sidebar-nav" aria-label="Điều hướng chính">
          <a class="sidebar-nav__item" href="./index.html">
            <span aria-hidden="true">▤</span>
            <span>Thư viện</span>
          </a>

          <a class="sidebar-nav__item" href="./manage.html">
            <span aria-hidden="true">⚙</span>
            <span>Quản lý sách</span>
          </a>
        </nav>

        <div class="sidebar__footer">
          <div class="sidebar__book-count">
            <strong id="sidebarBookCount">0</strong>
            <span>cuốn sách</span>
          </div>

          <div class="text-secondary">Frontend jQuery</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="page-header">
          <div>
            <a class="button" href="./index.html"> ← Quay lại thư viện </a>

            <h1 class="readerPageTitle" class="page-title reader-page-title">
              Đọc sách
            </h1>

            <p id="readerPageDescription" class="page-description">
              Đang tải thông tin sách...
            </p>
          </div>
        </header>

        <section class="page-body">
          <div id="readerLoading" class="library-state">
            <div class="library-state__content">
              <span class="loading-spinner" aria-hidden="true"></span>
              <span>Đang tải sách và PDF...</span>
            </div>
          </div>

          <div id="readerError" class="library-state is-hidden" role="alert">
            <div class="library-state__content">
              <strong>Không thể mở sách</strong>
              <p id="readerErrorMessage"></p>

              <a class="button" href="./index.html"> Quay lại thư viện </a>
            </div>
          </div>

          <div id="readerLayout" class="reader-layout is-hidden">
            <aside class="reader-book-panel">
              <div class="reader-cover">
                <span id="readerBookInitials">BK</span>
              </div>

              <h2 id="readerBookTitle"></h2>

              <p id="readerBookMeta" class="text-secondary"></p>

              <div id="readerBookTags" class="tag-list"></div>

              <span id="readerSourceBadge" class="status-badge"></span>
            </aside>

            <div class="pdf-viewer">
              <div class="pdf-toolbar">
                <button
                  id="previousPageButton"
                  class="button button--small"
                  type="button"
                >
                  ← Trang trước
                </button>

                <span id="pageIndicator">Trang — / —</span>

                <button
                  id="nextPageButton"
                  class="button button--small"
                  type="button"
                >
                  Trang sau →
                </button>

                <button
                  id="zoomOutButton"
                  class="button button--small"
                  type="button"
                >
                  −
                </button>

                <span id="zoomIndicator">110%</span>

                <button
                  id="zoomInButton"
                  class="button button--small"
                  type="button"
                >
                  +
                </button>

                <a
                  id="downloadPdfButton"
                  class="button button--primary pdf-download"
                  href="#"
                >
                  Tải PDF
                </a>
              </div>

              <div id="pdfCanvasArea" class="pdf-canvas-area">
                <canvas id="pdfCanvas"></canvas>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/pdf-store.js"></script>

    <script type="module" src="./js/reader.js"></script>
  </body>
</html>
