# Single entry point. Everything the browser touches comes through here, so the frontend and the
# API are same-origin — which is what makes cookies, CSRF and the generated client straightforward.
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Answered locally and on purpose: this says the proxy is up, NOT that any upstream works.
    # A proxy reporting healthy while returning 502 for every route is the normal failure here,
    # which is why a deploy check must call a real route rather than this one.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev server websocket for hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
