# Single entry point. Everything the browser touches comes through here, so the frontend and the
# API are same-origin — which is what makes cookies, CSRF and the generated client straightforward.
server {
    listen 80;
    server_name _;
    server_tokens off;
    http2 off;

    # Không có cổng QUIC/UDP hoặc Alt-Svc: không bật HTTP/3.
    # HTTP hiện chỉ dành cho loopback; HTTPS nội bộ thuộc bước ghép hệ thống P0.

    client_max_body_size 50m;

    # Answered locally and on purpose: this says the proxy is up, NOT that any upstream works.
    # A proxy reporting healthy while returning 502 for every route is the normal failure here,
    # which is why a deploy check must call a real route rather than this one.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        # Giữ nguyên /api/v1 khi chuyển tới backend, đúng BD-05.
        proxy_pass http://book_reader_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://book_reader_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev server websocket for hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
