  function shell(content,title) {

    const [title,text,label]=messages[state.modal];

  function say(text) {notice.textContent=text;}
  function save() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen:state.screen,device:state.device,theme:state.theme,format:state.format},privateContent:{page:state.page,tocTab:state.tocTab}}).catch(()=>{});
  }
  function restore(saved) {
    if(!saved) return;
    const data={...(saved.modelContent||{}),...(saved.privateContent||{})};
    if(codes[data.screen]) state.screen=data.screen;
    if(['pc','mobile'].includes(data.device)) state.device=data.device;
    if(['light','dark','system'].includes(data.theme)) state.theme=data.theme;
    if(['PDF','EPUB'].includes(data.format)) state.format=data.format;
    if(Number.isInteger(data.page)&&data.page>=1&&data.page<=216) state.page=data.page;
    if(['original','personal','bookmarks'].includes(data.tocTab)) state.tocTab=data.tocTab;
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b)) return;

    const a=b.dataset.action;if(!a) return;
    if(a.startsWith('go-')) {state.screen=a.slice(3);state.options=false;state.modal=null;}
    else if(a==='theme') state.theme=b.dataset.value;
    else if(a==='open-book') {state.format=b.dataset.format;state.screen='reader';}
    else if(a==='import-file'||a==='import-url') state.importTab=a==='import-file'?'file':'url';
    else if(a==='simulate-import') {root.querySelector('#bd-import-result').innerHTML='<div class="bd-note">Minh họa trạng thái: Chờ xử lý → Đang xử lý → Hoàn tất. Sách đã có trong thư viện mẫu.</div>';say('Đây là bản phác thảo; chưa tải tệp hoặc gọi máy chủ.');return;}
    else if(a==='save-detail') {say('Minh họa lưu thông tin. Không thay đổi dữ liệu dự án.');return;}
    else if(a==='options') state.options=!state.options;
    else if(a==='pdf-night') state.pdfNight=!state.pdfNight;
    else if(a==='bookmark') {state.bookmarked=!state.bookmarked;say(state.bookmarked?'Đã thêm đánh dấu trong bản mẫu.':'Đã bỏ đánh dấu trong bản mẫu.');}
    else if(a==='toc-tab') state.tocTab=b.dataset.value;
    else if(a==='close-toc') state.screen='reader';
    else if(a==='jump') {state.page=Number(b.dataset.page);state.screen='reader';}
    else if(a==='next'||a==='prev') {state.page=Math.max(1,Math.min(216,state.page+(a==='next'?1:-1)));say(state.format==='EPUB'?'Minh họa chuyển vị trí EPUB; không dùng số trang PDF cố định.':'');}
    else if(a==='add-toc') {state.addedToc=root.querySelector('#bd-new-toc').value.trim()||'Mục mới của tôi';say('Đã thêm mục minh họa tại vị trí hiện tại.');}
    else if(a==='reorder') {say('Khi triển khai: dùng nút Lên / Xuống để đổi thứ tự mục, hỗ trợ bàn phím.');return;}
    else if(a==='choose-local') {state.screen='reader';say('Minh họa: đã chọn vị trí trên thiết bị.');}
    else if(a==='choose-server') state.modal='server';
    else if(a==='defer-conflict') {state.screen='reader';say('Xung đột được giữ lại để xử lý sau trong ứng dụng thực tế.');}
    else if(a==='delete-download') state.modal='download';
    else if(a==='delete-book') state.modal='book';
    else if(a==='reset-progress') state.modal='reset';
    else if(a==='discard-pending') state.modal='discard';
    else if(a==='cancel-modal') state.modal=null;
    else if(a==='confirm-modal') {if(state.modal==='reset') state.page=1;if(state.modal==='discard') state.pendingRemoved=true;if(state.modal==='server'){state.page=68;state.screen='reader';}state.modal=null;say('Đã xác nhận thao tác trong bản minh họa. Dữ liệu thật không bị thay đổi.');}
    else if(a==='pending-open') state.pendingOpen=!state.pendingOpen;
    else if(a==='copy-pending'||a==='export-pending') {state.pendingOpen=true;say('Bản phác thảo hiển thị JSON để xem trước; chưa sao chép hoặc xuất tệp.');}
    else if(a==='download'||a==='sync') {say('Minh họa thao tác '+(a==='download'?'tải sách trên thiết bị.':'đồng bộ với máy chủ trong mạng nhà.'));return;}
    render();save();
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el===picker) {state.screen=picker.value;state.modal=null;state.options=false;render();save();return;}
    if(el.id==='bd-filter'||el.id==='bd-sort') {state[el.id==='bd-filter'?'filter':'sort']=el.value;renderBooks();return;}
    if(el.id==='bd-format') {state.format=el.value;render();save();return;}
    if(el.id==='bd-page-input') {state.page=Math.max(1,Math.min(216,Number(el.value)||1));render();save();return;}
    if(el.id==='bd-file') {const file=el.files?.[0];if(file) root.querySelector('#bd-file-name').textContent=file.name;say('Chỉ hiển thị tên tệp; không đọc hoặc tải tệp.');}
    if(el.id==='bd-font') root.querySelectorAll('.bd-page p').forEach(p=>p.style.fontSize=el.value+'px');
    if(el.id==='bd-leading') root.querySelectorAll('.bd-page p').forEach(p=>p.style.lineHeight=el.value);
    if(el.id==='bd-margin') root.querySelector('.bd-page').style.paddingInline=el.value+'px';
    if(el.id==='bd-zoom') say('Bản mẫu giữ trang vừa khung để xem bố cục. Phóng to và kéo trang sẽ được triển khai trong bộ đọc PDF.');
  });
  root.addEventListener('input',e=>{if(e.target.id==='bd-search'){state.query=e.target.value;renderBooks();}});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal=null;if(state.screen==='conflict'||state.screen==='toc')state.screen='reader';state.options=false;render();app.querySelector('[data-action="go-toc"],[data-action="go-reader"],button')?.focus();}if(e.key==='Tab'){const dialog=app.querySelector('[role="dialog"]');if(!dialog)return;const items=dialog.querySelectorAll('button:not(:disabled),input,select,textarea');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){restore(saved);render();}});
  if(globalThis.Tweak) {
    const tweak=new globalThis.Tweak({container:app,onChange:()=>{app.style.setProperty('--br-radius',design.radius+'px');app.style.setProperty('--br-space',(design.compact?18:26)+'px');}});
    tweak.addSlider(design,'radius',{label:'Bo góc bề mặt',min:4,max:20,unit:'px',reference:'--br-radius'});
    tweak.addToggle(design,'compact',{label:'Thu gọn khoảng cách'});
  }
})();
</script>
